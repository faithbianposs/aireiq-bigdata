services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:49092:49092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:49092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:49092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "127.0.0.1:48085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aireiq
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
  eventos:
    build: ./services/eventos
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./outputs:/evidence
      - ./mediciones_aire_rows.csv:/data/mediciones_aire_rows.csv:ro
    depends_on:
      kafka:
        condition: service_healthy
    command: ["worker"]
    mem_limit: 256m
    restart: on-failure
  spark-streaming:
    build: ./services/streaming
    profiles: [streaming]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./outputs:/evidence
      - spark-ivy:/root/.ivy2.5.2
      - ./notebooks:/notebooks
    depends_on:
      kafka:
        condition: service_healthy
    command: ["live"]
    mem_limit: 3g
volumes:
  kafka-data:
  spark-ivy:
