services:
  live-forecast:
    build: ./services/streaming
    profiles: [live]
    entrypoint: [spark-submit, --master, "local[2]", --driver-memory, 1g, --packages, "org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0", /app/live_forecast.py]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./outputs:/evidence
      - spark-ivy:/root/.ivy2.5.2
    mem_limit: 3g
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
