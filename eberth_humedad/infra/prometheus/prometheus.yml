global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: aireiq
    static_configs:
      - targets: ['telemetry:9108']
